<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图片与资料管理</title><style>body{margin:0;background:#f6f7fb;font:14px system-ui,sans-serif}.modules{display:flex;gap:8px;padding:16px 28px 0}.modules button{padding:10px 20px;border:1px solid #ddd;border-radius:10px;background:white;cursor:pointer;color:#29354b}.modules button[aria-selected=true]{background:#6556b8;color:white;border-color:#6556b8}[hidden]{display:none!important}[data-theme=dark] body{background:#161b25}</style></head><body><nav class="modules" role="tablist" aria-label="资料模块"><button id="characters-tab" role="tab" aria-controls="characters-panel" aria-selected="true">偶像大师角色</button><button id="music-tab" role="tab" aria-controls="music-panel" aria-selected="false">唱见／偶像大师幕后</button></nav><div id="characters-panel" role="tabpanel" aria-labelledby="characters-tab"></div><div id="music-panel" role="tabpanel" aria-labelledby="music-tab" hidden></div><template id="characters-template"><link rel="stylesheet" href="./style.css"><div class="module-body">
<img id="tantou-mask" src="./assets/tantou-mask.png" alt="" hidden>
<header><div><span class="eyebrow">IDOLM@STER · 素材工作室</span><h1>角色图片与资料</h1><p>选一位角色，整理生日，调好属于他的画面。</p></div><button id="new" class="primary">＋ 新增角色</button></header>
<div id="status" role="status" aria-live="polite">正在连接 AstrBot…</div>
<div class="workspace">
<aside><label for="search">角色目录</label><input id="search" type="search" placeholder="搜索中文、日文或别名"><div class="image-filter"><button id="missing-images" type="button" aria-pressed="false">无图片</button><select id="missing-kind" aria-label="缺图用途" hidden><option value="any">任一用途缺图</option><option value="tantou">缺担当头像</option><option value="birthday">缺生日图</option><option value="both">两种都缺图</option></select></div><div id="count" class="muted"></div><nav id="characters" aria-label="角色列表"></nav></aside>
<main><div id="empty" class="empty">从左侧选择角色，或新增一位角色。</div>
<form id="form" hidden><fieldset id="fields">
<div class="section-head"><div><span class="eyebrow">PROFILE</span><h2 id="title"></h2></div><span id="origin" class="badge"></span></div>
<section class="profile-grid">
<label>登记名字<input id="name" maxlength="80" required placeholder="用于搜索和加推，例如 美作武史"><small>已有角色的登记名字保持固定。</small></label>
<label>日文显示名<input id="name_jp" maxlength="80" placeholder="留空沿用原资料"><small id="base_name"></small></label>
<label>所属企划<select id="brand"></select></label>
<label>补充别名<input id="aliases" placeholder="每个别名用逗号分隔"><small>例如 武内p, 灰姑娘P</small></label>
<label>生日来源<select id="birthday_mode"><option value="inherit">沿用基础数据</option><option value="custom">手动设置</option><option value="none">没有生日／不参与生日提醒</option></select></label>
<label>生日<input id="birthday" placeholder="MM-DD，例如 04-16" maxlength="5"><small id="base_birthday"></small></label>
<label class="wide">资料来源或备注<input id="source_note" maxlength="500" placeholder="可记录官网链接或修改原因"></label>
</section>
<div class="section-head image-heading"><div><span class="eyebrow">ARTWORK</span><h2>两种用途，分别调整</h2></div><p class="muted">拖动画面调整位置，也可以使用下方滑块。</p></div>
<div class="image-grid" id="image_editors"></div>
<div class="actions"><span id="dirty" class="muted">修改后点击保存生效</span><button id="discard" type="button">撤销未保存修改</button><button type="submit" class="primary">保存修改</button></div>
</fieldset></form>
<section id="preview_area" hidden><div class="section-head"><h2>实际效果</h2><button id="preview" type="button">预览已保存的名片</button></div><p class="muted">裁切框实时预览；这里使用插件实际渲染器生成已保存的生日卡和担当名片。</p><div id="previews"></div></section>
</main></div>
<footer><details><summary>数据来源与保存位置</summary><p id="sources"></p><p>手动资料优先于自动同步，图片以副本保存。原来的本地图不会被覆盖。生日设为“沿用基础数据”、图片选择“恢复原图”后保存，即可恢复原有来源。</p><p id="storage"></p></details></footer>

</div></template><template id="music-template"><link rel="stylesheet" href="./people.css"><div class="module-body">
<img id="mask" src="./assets/tantou-mask.png" alt="" hidden>
<header><div><h1>唱见与偶像大师幕后资料</h1><p>整理名字与生日，调整担当名片里的头像。</p></div></header>
<div id="status" role="status" aria-live="polite">正在连接 AstrBot…</div>
<div class="workspace">
<aside><label for="search">人物目录</label><input id="search" type="search" placeholder="搜索名字、罗马音或别名">
<select id="kind" aria-label="人物类别"><option value="">全部</option><option value="utaite">唱见</option><option value="music_creator">偶像大师幕后</option></select>
<div class="filters"><label><input id="missing" type="checkbox"> 缺图片</label><label><input id="no-birthday" type="checkbox"> 未登记生日</label></div>
<small id="count"></small><nav id="list" aria-label="人物列表"></nav><div class="paging"><button id="previous" type="button">上一页</button><span id="page"></span><button id="next" type="button">下一页</button></div></aside>
<main><div id="empty">从左侧选择一位人物。</div>
<form id="form" hidden><fieldset id="fields"><div class="heading"><h2 id="title"></h2><span id="badge"></span></div>
<div class="profile-grid"><label>显示名字<input id="name" required maxlength="100"><small id="base-name"></small></label>
<label>补充别名<textarea id="aliases" rows="3" placeholder="用逗号或换行分隔"></textarea><small>原目录中的名字和别名会继续保留。</small></label>
<label>生日来源<select id="birthday-mode"><option value="inherit">沿用基础资料</option><option value="custom">手动设置</option><option value="none">不登记生日</option></select></label>
<label>生日<input id="birthday" placeholder="MM-DD，例如 10-18" maxlength="5"><small id="base-birthday"></small></label>
<label class="wide">来源说明或备注<input id="note" maxlength="500"></label></div>
<div class="artwork"><section><h2>担当头像</h2><div class="stage"><canvas id="canvas" width="600" height="540" aria-label="拖动调整头像位置"></canvas></div>
<input id="upload" type="file" accept="image/png,image/jpeg,image/webp,image/gif"><small>支持 PNG / JPEG / WebP / GIF，最大 10 MB。</small></section>
<section class="controls"><label>填充方式<select id="fit"><option value="contain">完整显示</option><option value="cover">铺满头像框</option></select></label>
<label>缩放<input id="zoom" type="range" min="0.25" max="4" step="0.01"></label>
<label>水平位置<input id="x" type="range" min="0" max="1" step="0.001"></label>
<label>垂直位置<input id="y" type="range" min="0" max="1" step="0.001"></label>
<div class="buttons"><button id="center" type="button">居中</button><button id="directory-image" type="button" hidden>载入目录头像</button><button id="restore" type="button">恢复来源图片</button></div><small id="image-note"></small></section></div>
<div class="actions"><small id="dirty">修改后点击保存生效</small><button id="discard" type="button">撤销未保存修改</button><button type="submit" class="primary">保存修改</button></div>
</fieldset></form>
<section id="preview-area" hidden><div class="heading"><h2>实际名片</h2><button id="preview" type="button">预览已保存的名片</button></div><img id="preview-image" alt="担当名片预览" hidden></section>
<details id="source-area" hidden><summary>资料来源</summary><div id="sources"></div></details>
</main></div><footer><p>这里管理唱见和偶像大师幕后人员。未公开的生日保留为空。</p><p id="storage"></p></footer>
</div></template><script type="module" src="./app.js"></script><script type="module" src="./people.js"></script><script type="module" src="./workspace.js"></script></body></html>
